<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Aplicación web para el registro y gestión de vehículos. Proyecto Final DTW135 - UES FMOcc." />

  <title>Registro de Vehículos | DTW135 - UES FMOcc</title>

  <!-- =========================================================
       Bootstrap 5 — CSS (CDN)
  ========================================================== -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- =========================================================
       Cabecera principal de la aplicación
  ========================================================== -->
  <header id="app-header">
    <!-- Navegación y branding irán aquí -->
  </header>

  <!-- =========================================================
       Contenedor principal — vistas CRUD del módulo de vehículos
  ========================================================== -->
  <main id="crud-container">

    <!-- Sección para la vista de listado / tabla de registros -->
    <section id="section-list">
    </section>

    <!-- Sección para la vista del formulario de registro / edición -->
    <section id="section-form">
    </section>

  </main>

  <!-- =========================================================
       Panel lateral — métricas y estadísticas del sistema
  ========================================================== -->
  <aside id="dashboard-container">
    <!-- Tarjetas de métricas e indicadores irán aquí -->
  </aside>

  <!-- =========================================================
       Pie de página
  ========================================================== -->
  <footer id="app-footer">
    <!-- Información institucional y créditos irán aquí -->
  </footer>

  <!-- =========================================================
       Bootstrap 5 — JS Bundle con Popper (CDN)
  ========================================================== -->
  <script 
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

  <!-- Scripts locales de la aplicación -->
  <script src="js/app.js"></script>

</body>
</html>
